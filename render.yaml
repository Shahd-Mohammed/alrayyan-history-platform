services:
  - type: web
    name: alrayyan-learning-platform
    runtime: python
    plan: free
    buildCommand: apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-ara && pip install -r requirements.txt
    preDeployCommand: flask --app app db upgrade
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: alrayyan-history-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: EMBEDDING_API_URL
        value: https://openrouter.ai/api/v1/embeddings

databases:
  - name: alrayyan-history-db
    plan: free
