name: Safe merge checks

on:
  push:
    branches:
      - "safe-merge/**"
      - "merge-candidate/**"
  pull_request:
    branches:
      - master

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Tesseract and Arabic OCR language data
        run: |
          command -v tesseract
          tesseract --list-langs | grep -Fx ara
          tesseract --list-langs | grep -Fx eng

      - name: Compile application and test scripts
        run: python -m compileall -q app.py config.py alrayyan scripts

      - name: Test AI tutor prompt-version column size
        run: PYTHONPATH=. python scripts/test_tutor_prompt_version.py

      - name: Test file storage and concept-map downloads
        run: PYTHONPATH=. python scripts/test_file_storage.py

      - name: Test question interaction grading
        run: PYTHONPATH=. python scripts/test_question_interactions.py

      - name: Test adaptive challenge scoring
        run: PYTHONPATH=. python scripts/test_challenge_engine.py

      - name: Test AI tutor payload validation
        run: PYTHONPATH=. python scripts/test_tutor_logic.py

      - name: Test worksheet lifecycle and protected deletion
        run: PYTHONPATH=. python scripts/test_worksheet_lifecycle.py

      - name: Test admin permissions, password reset, and curriculum history
        run: PYTHONPATH=. python scripts/test_security_and_curriculum.py

      - name: Test manual grading, score totals, and XP consistency
        run: PYTHONPATH=. python scripts/test_attempt_scoring.py
